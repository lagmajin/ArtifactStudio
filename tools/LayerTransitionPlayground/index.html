<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layer Transition Playground</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
      color: #e7e9ef;
      background: #101216;
      --panel: #24272d;
      --field: #171a1f;
      --line: #414650;
      --muted: #a5aab5;
      --blue: #338cf2;
      --cyan: #54c7e8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    button, input, select { font: inherit; color: inherit; }
    button, select, input[type="number"] { border: 1px solid var(--line); border-radius: 6px; background: var(--field); }
    button { cursor: pointer; }
    .dialog { width: min(820px, 100%); overflow: hidden; border: 1px solid #555b65; border-radius: 12px; background: #202329; box-shadow: 0 24px 80px #0009; }
    .titlebar { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 20px; font-weight: 650; }
    .close { width: 32px; height: 32px; background: transparent; border: 0; font-size: 22px; color: #c4c8d0; }
    .content { padding: 18px 22px 16px; }
    .section-label { margin: 0 0 9px; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .05em; }
    .presets { display: grid; grid-template-columns: repeat(4, 1fr) 148px; gap: 8px; margin-bottom: 16px; }
    .preset { min-height: 58px; padding: 8px; color: #d9deea; background: linear-gradient(155deg, #171a20, #343b51); }
    .preset[aria-pressed="true"] { outline: 2px solid var(--cyan); outline-offset: -2px; }
    select { min-height: 38px; padding: 0 10px; }
    .custom-select { width: 100%; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #22252b; }
    .card h2 { margin: 0; padding: 9px 13px; border-bottom: 1px solid var(--line); background: #2b2f36; font-size: 14px; }
    .card-body { padding: 12px 14px; }
    .check-title { display: flex; align-items: center; gap: 9px; font-weight: 600; }
    input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--blue); }
    .fade-block + .fade-block { margin-top: 12px; padding-top: 11px; border-top: 1px solid #3a3e47; }
    .field-row { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; margin: 8px 0 0 26px; color: #bec3ce; font-size: 12px; }
    .field-row select, .field-row input[type="number"] { width: 100%; min-height: 32px; padding: 0 9px; }
    .slider-row { grid-template-columns: 74px 1fr 68px; margin: 14px 0; }
    input[type="range"] { width: 100%; accent-color: var(--blue); }
    .slider-value { padding: 6px 8px; text-align: center; border: 1px solid var(--line); border-radius: 6px; background: var(--field); }
    .preview { margin-top: 14px; }
    .preview-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; background: #2b2f36; font-size: 13px; font-weight: 600; }
    .preview-box { padding: 10px 12px 8px; border: 1px solid var(--line); border-radius: 0 0 8px 8px; background: #181b20; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .axis { stroke: #68707c; stroke-width: 1; }
    .gridline { stroke: #343943; stroke-width: 1; stroke-dasharray: 3 4; }
    .opacity-area { fill: #7778ed; opacity: .75; }
    .blur-line { fill: none; stroke: #459ffb; stroke-width: 3; }
    .legend { display: flex; flex-wrap: wrap; gap: 18px; margin: 6px 2px 0; color: #b5bac4; font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 9px; border-radius: 2px; background: #7778ed; }
    .swatch.line { height: 3px; background: #459ffb; }
    .apply-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
    .apply-row label { color: #bfc4ce; font-size: 12px; }
    .apply-row select { width: 240px; min-height: 34px; }
    .replace { display: flex; align-items: center; gap: 7px; margin-left: auto; color: #c4c8d0; font-size: 12px; }
    .footer { display: flex; justify-content: flex-end; gap: 9px; padding: 13px 22px; border-top: 1px solid var(--line); background: #1c1f24; }
    .footer button { min-width: 130px; padding: 9px 14px; }
    .primary { border-color: #368bf0; background: #287de2; font-weight: 650; }
    .status { min-height: 18px; margin-right: auto; color: #9fb0c8; font-size: 12px; align-self: center; }
    @media (max-width: 660px) {
      body { padding: 8px; }
      .content { padding: 14px; }
      .presets { grid-template-columns: repeat(2, 1fr); }
      .controls { grid-template-columns: 1fr; }
      .apply-row { flex-wrap: wrap; }
      .replace { margin-left: 0; }
      .footer { padding: 12px 14px; }
      .footer button { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="dialog" role="dialog" aria-labelledby="dialog-title">
    <header class="titlebar">
      <h1 id="dialog-title">レイヤートランジションを生成</h1>
      <button class="close" aria-label="閉じる">×</button>
    </header>
    <section class="content">
      <p class="section-label">プリセット</p>
      <div class="presets" role="group" aria-label="プリセット">
        <button class="preset" data-preset="fade" aria-pressed="false">フェード</button>
        <button class="preset" data-preset="fadeBlur" aria-pressed="true">フェード＋ブラー</button>
        <button class="preset" data-preset="soft" aria-pressed="false">ソフト（なめらか）</button>
        <button class="preset" data-preset="hard" aria-pressed="false">ハード（短時間）</button>
        <select class="custom-select" id="presetSelect" aria-label="プリセット詳細">
          <option value="custom">カスタム</option>
          <option value="fadeBlur">フェード＋ブラー</option>
          <option value="fade">フェード</option>
        </select>
      </div>

      <div class="controls">
        <section class="card">
          <h2>フェード</h2>
          <div class="card-body">
            <div class="fade-block">
              <label class="check-title"><input id="fadeInEnabled" type="checkbox" checked>フェードイン</label>
              <label class="field-row">継続時間 <input id="fadeInDuration" type="number" min="1" max="120" value="12">フレーム</label>
              <label class="field-row">イージング <select id="fadeInEase"><option>イーズ</option><option>リニア</option><option>イーズイン</option><option>イーズアウト</option></select></label>
            </div>
            <div class="fade-block">
              <label class="check-title"><input id="fadeOutEnabled" type="checkbox" checked>フェードアウト</label>
              <label class="field-row">継続時間 <input id="fadeOutDuration" type="number" min="1" max="120" value="12">フレーム</label>
              <label class="field-row">イージング <select id="fadeOutEase"><option>イーズ</option><option>リニア</option><option>イーズイン</option><option>イーズアウト</option></select></label>
            </div>
          </div>
        </section>
        <section class="card">
          <h2><label class="check-title"><input id="blurEnabled" type="checkbox" checked>ブラー</label></h2>
          <div class="card-body">
            <label class="field-row slider-row">適用量 <input id="blurAmount" type="range" min="0" max="48" value="18"><output class="slider-value" id="blurValue">18 px</output></label>
            <label class="field-row">タイミング <select id="blurTiming"><option value="sync">フェードに同期</option><option value="in">フェードインのみ</option><option value="out">フェードアウトのみ</option><option value="full">全体に適用</option></select></label>
            <label class="field-row">ブラーの種類 <select id="blurType"><option>ガウス</option><option>ボックス</option><option>方向</option></select></label>
          </div>
        </section>
      </div>

      <section class="preview">
        <div class="preview-head">⌄　タイムラインプレビュー</div>
        <div class="preview-box">
          <svg viewBox="0 0 700 156" role="img" aria-label="フェードとブラーの時間変化プレビュー">
            <g id="ticks"></g>
            <line class="axis" x1="122" y1="39" x2="680" y2="39" />
            <line class="axis" x1="122" y1="85" x2="680" y2="85" />
            <line class="axis" x1="122" y1="132" x2="680" y2="132" />
            <text x="8" y="66" fill="#c0c5cf" font-size="11">レイヤー（不透明度）</text>
            <text x="8" y="113" fill="#c0c5cf" font-size="11">ブラーの強さ</text>
            <path id="opacityPath" class="opacity-area" d="M122 84 L178 42 L624 42 L680 84 Z" />
            <path id="blurPath" class="blur-line" d="M122 130 Q150 124 178 102 L624 102 Q652 124 680 130" />
            <line x1="289" y1="25" x2="289" y2="136" stroke="#55c8e8" stroke-width="2" />
            <rect x="276" y="18" width="27" height="18" rx="4" fill="#55c8e8" />
            <text x="282" y="31" fill="#10202a" font-size="10" font-weight="700">36</text>
          </svg>
          <div class="legend"><span><i class="swatch"></i>レイヤーの不透明度（フェード）</span><span><i class="swatch line"></i>ブラーの強さ</span><span id="rangeSummary">フェードイン: 0–12 f　|　フェードアウト: 108–120 f</span></div>
        </div>
      </section>

      <div class="apply-row">
        <label for="target">適用対象</label>
        <select id="target"><option>選択中のレイヤー (3)</option><option>現在のレイヤー</option><option>コンポジション内の全レイヤー</option></select>
        <label class="replace"><input type="checkbox">既存のキーフレームを置き換える</label>
      </div>
    </section>
    <footer class="footer">
      <span class="status" id="status" aria-live="polite"></span>
      <button id="cancelButton">キャンセル</button>
      <button class="primary" id="applyButton">生成して適用</button>
    </footer>
  </main>
  <script>
    const presets = {
      fade: { blur: false, amount: 0, in: 12, out: 12, easing: "リニア" },
      fadeBlur: { blur: true, amount: 18, in: 12, out: 12, easing: "イーズ" },
      soft: { blur: true, amount: 28, in: 24, out: 24, easing: "イーズイン" },
      hard: { blur: false, amount: 0, in: 5, out: 5, easing: "イーズアウト" }
    };
    const byId = id => document.getElementById(id);
    const inputIds = ["fadeInEnabled", "fadeOutEnabled", "fadeInDuration", "fadeOutDuration", "fadeInEase", "fadeOutEase", "blurEnabled", "blurAmount", "blurTiming", "blurType"];
    const controls = inputIds.map(byId);

    function currentPreset() {
      return {
        blur: byId("blurEnabled").checked,
        amount: Number(byId("blurAmount").value),
        in: Number(byId("fadeInDuration").value),
        out: Number(byId("fadeOutDuration").value),
        easing: byId("fadeInEase").value
      };
    }

    function updatePreview() {
      const values = currentPreset();
      const fadeIn = byId("fadeInEnabled").checked ? Math.max(1, Math.min(60, values.in)) : 0;
      const fadeOut = byId("fadeOutEnabled").checked ? Math.max(1, Math.min(60, values.out)) : 0;
      const startX = 122 + fadeIn * (558 / 120);
      const endX = 680 - fadeOut * (558 / 120);
      const topY = byId("fadeInEnabled").checked ? 42 : 18;
      const bottomY = byId("fadeOutEnabled").checked ? 84 : 18;
      byId("opacityPath").setAttribute("d", `M122 84 L${startX} ${topY} L${endX} ${topY} L680 ${bottomY} Z`);
      const blurHeight = byId("blurEnabled").checked ? Math.min(36, values.amount) : 0;
      byId("blurPath").setAttribute("d", `M122 130 Q${startX - 24} 130 ${startX} ${130 - blurHeight} L${endX} ${130 - blurHeight} Q${endX + 24} 130 680 130`);
      byId("blurValue").textContent = `${values.amount} px`;
      byId("rangeSummary").textContent = `フェードイン: 0–${fadeIn} f　|　フェードアウト: ${120 - fadeOut}–120 f`;
      byId("blurAmount").disabled = !byId("blurEnabled").checked;
      document.querySelectorAll(".preset").forEach(button => button.setAttribute("aria-pressed", "false"));
      byId("presetSelect").value = "custom";
    }

    function selectPreset(name) {
      const preset = presets[name];
      if (!preset) return;
      byId("fadeInEnabled").checked = true;
      byId("fadeOutEnabled").checked = true;
      byId("fadeInDuration").value = preset.in;
      byId("fadeOutDuration").value = preset.out;
      byId("fadeInEase").value = preset.easing;
      byId("fadeOutEase").value = preset.easing;
      byId("blurEnabled").checked = preset.blur;
      byId("blurAmount").value = preset.amount;
      byId("presetSelect").value = name;
      document.querySelectorAll(".preset").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.preset === name)));
      updatePreview();
    }

    function drawRuler() {
      const ticks = byId("ticks");
      for (let frame = 0; frame <= 120; frame += 12) {
        const x = 122 + frame * (558 / 120);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x); line.setAttribute("x2", x); line.setAttribute("y1", 24); line.setAttribute("y2", 140);
        line.setAttribute("class", "gridline"); ticks.append(line);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", x - 7); text.setAttribute("y", 15); text.setAttribute("fill", "#b7bdc8"); text.setAttribute("font-size", "10"); text.textContent = frame;
        ticks.append(text);
      }
    }

    controls.forEach(control => control.addEventListener("input", updatePreview));
    controls.forEach(control => control.addEventListener("change", updatePreview));
    document.querySelectorAll(".preset").forEach(button => button.addEventListener("click", () => selectPreset(button.dataset.preset)));
    byId("presetSelect").addEventListener("change", event => selectPreset(event.target.value));
    byId("applyButton").addEventListener("click", () => { byId("status").textContent = "設定プレビューを適用しました（試作画面内のみ）"; });
    byId("cancelButton").addEventListener("click", () => { byId("status").textContent = "変更をキャンセルしました"; });
    document.querySelector(".close").addEventListener("click", () => { byId("status").textContent = "ダイアログを閉じる操作の試作です"; });
    drawRuler();
    updatePreview();
  </script>
</body>
</html>
